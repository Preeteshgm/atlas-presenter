<?xml version="1.0" encoding="UTF-8"?>
<!-- Concrete — an Atlas Presenter backdrop.

     Grey, troweled. Pairs with: Mono, Plain (light).

     Settings -> Atlas -> Backdrop -> An image, then pick this file. Or put
     `image: Atlas/Backdrops/Concrete.svg` on a canvas's #deck card.

     A backdrop sits behind the cards and must never compete with them: these
     are all low contrast on purpose. Turn "Darken the backdrop" up if a deck
     still feels busy. Edit the colours below to make your own — it is a text
     file, and SVG stays sharp on any projector. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"
     width="1920" height="1080" preserveAspectRatio="xMidYMid slice">

  <defs>
  <filter id="c" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
  </filter>
  </defs>
  <rect width="1920" height="1080" fill="#DEDEDA"/>
  <rect width="1920" height="1080" filter="url(#c)" opacity="0.8"/>
</svg>
