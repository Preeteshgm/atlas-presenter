name: Release

# Obsidian and BRAT both look for a release whose tag is the bare version
# number ("0.1.0", not "v0.1.0") with main.js, manifest.json and styles.css
# attached as loose assets. Anything else and installs silently fail.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  # Both required by attest-build-provenance.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # package.json is not shipped, but it is what `npm version` drives, so
      # letting it drift means the next bump starts from the wrong number.
      - name: Check the tag matches every version file
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          PKG=$(node -p "require('./package.json').version")
          MIN=$(node -p "require('./manifest.json').minAppVersion")
          VERSIONS=$(node -p "require('./versions.json')['$TAG'] || ''")
          fail=0
          [ "$TAG" = "$MANIFEST" ] || { echo "manifest.json is $MANIFEST, tag is $TAG" >&2; fail=1; }
          [ "$TAG" = "$PKG" ]      || { echo "package.json is $PKG, tag is $TAG" >&2; fail=1; }
          [ -n "$VERSIONS" ]       || { echo "versions.json has no entry for $TAG" >&2; fail=1; }
          [ "$VERSIONS" = "$MIN" ] || { echo "versions.json[$TAG] is $VERSIONS, minAppVersion is $MIN" >&2; fail=1; }
          exit $fail

      # Provenance, so anyone can verify these files were built from this
      # repository by this workflow rather than uploaded by hand.
      - name: Attest the build
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

      # Only the three files Obsidian fetches. A zip beside them is never
      # downloaded, and the store's review flags it as an unsupported extra.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            main.js manifest.json styles.css
