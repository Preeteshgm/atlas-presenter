<?xml version="1.0" encoding="UTF-8"?>
<!-- Amber stage — an Atlas Presenter backdrop.

     A warm wash with a deep brown edge.
     A radial wash from the top edge — the light sits at cx/cy.

     TO USE   Settings > Atlas > Backdrop > An image, then pick this file.
              Or put  image: Atlas/Backdrops/Amber stage.svg  on a #deck card.

     TO EDIT  Change the stop-color values below. That is the whole file.
              Keep the two tones close: a backdrop with real contrast in it
              competes with the cards, and the cards always lose.

     A gradient does not have to be a file at all. A theme can say
     --backdrop: linear-gradient(180deg, #FBFCFA, #E4EAEC);
     and skip this entirely. See Themes/Backdrops.css for all of these
     as one-liners you can paste into any theme. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"
     width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="g" cx="0.5" cy="0" r="1.15">
      <stop offset="0" stop-color="#3A2A18"/>
      <stop offset="1" stop-color="#0D0A07"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="#0D0A07"/>
  <rect width="1920" height="1080" fill="url(#g)"/>
</svg>
