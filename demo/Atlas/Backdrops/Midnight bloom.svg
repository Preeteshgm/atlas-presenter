<?xml version="1.0" encoding="UTF-8"?>
<!-- Midnight bloom — an Atlas Presenter backdrop.

     A single violet light in a black room. Pairs with: Midnight.

     Settings -> Atlas -> Backdrop -> An image, then pick this file. Or put
     `image: Atlas/Backdrops/Midnight bloom.svg` on a canvas's #deck card.

     A backdrop sits behind the cards and must never compete with them: these
     are all low contrast on purpose. Turn "Darken the backdrop" up if a deck
     still feels busy. Edit the colours below to make your own — it is a text
     file, and SVG stays sharp on any projector. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"
     width="1920" height="1080" preserveAspectRatio="xMidYMid slice">

  <defs>
    <radialGradient id="b" cx="0.5" cy="0" r="1.15">
      <stop offset="0" stop-color="#28203F"/>
      <stop offset="0.45" stop-color="#11141F"/>
      <stop offset="1" stop-color="#06080C"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.06" r="0.42">
      <stop offset="0" stop-color="#9A7CFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#9A7CFF" stop-opacity="0"/>
    </radialGradient>
  <filter id="mg" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
  </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#b)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" filter="url(#mg)" opacity="0.5"/>
</svg>
