<?xml version="1.0" encoding="UTF-8"?>
<!-- Slate vignette — an Atlas Presenter backdrop.

     Near-black, lit from above. Pairs with: Slate.

     Settings -> Atlas -> Backdrop -> An image, then pick this file. Or put
     `image: Atlas/Backdrops/Slate vignette.svg` on a canvas's #deck card.

     A backdrop sits behind the cards and must never compete with them: these
     are all low contrast on purpose. Turn "Darken the backdrop" up if a deck
     still feels busy. Edit the colours below to make your own — it is a text
     file, and SVG stays sharp on any projector. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"
     width="1920" height="1080" preserveAspectRatio="xMidYMid slice">

  <defs>
    <radialGradient id="v" cx="0.5" cy="0.02" r="1.1">
      <stop offset="0" stop-color="#1D2534"/>
      <stop offset="0.6" stop-color="#0E131B"/>
      <stop offset="1" stop-color="#070A0E"/>
    </radialGradient>
  <filter id="sg" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
  </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#v)"/>
  <rect width="1920" height="1080" filter="url(#sg)" opacity="0.55"/>
</svg>
