<?xml version="1.0" encoding="UTF-8"?>
<!-- Blueprint grid — an Atlas Presenter backdrop.

     Drafting paper: a 40px grid on deep blue. Pairs with: Blueprint.

     Settings -> Atlas -> Backdrop -> An image, then pick this file. Or put
     `image: Atlas/Backdrops/Blueprint grid.svg` on a canvas's #deck card.

     A backdrop sits behind the cards and must never compete with them: these
     are all low contrast on purpose. Turn "Darken the backdrop" up if a deck
     still feels busy. Edit the colours below to make your own — it is a text
     file, and SVG stays sharp on any projector. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"
     width="1920" height="1080" preserveAspectRatio="xMidYMid slice">

  <defs>
    <pattern id="fine" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2A6A8C" stroke-width="1" opacity="0.5"/>
    </pattern>
    <pattern id="bold" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#5FE3D0" stroke-width="1.4" opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="#0B2B3C"/>
  <rect width="1920" height="1080" fill="url(#fine)"/>
  <rect width="1920" height="1080" fill="url(#bold)"/>
</svg>
