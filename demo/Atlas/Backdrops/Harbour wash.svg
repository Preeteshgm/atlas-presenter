<?xml version="1.0" encoding="UTF-8"?>
<!-- Harbour wash — an Atlas Presenter backdrop.

     A calm gradient: cool white falling to pale steel. Pairs with: Harbour.

     Settings -> Atlas -> Backdrop -> An image, then pick this file. Or put
     `image: Atlas/Backdrops/Harbour wash.svg` on a canvas's #deck card.

     A backdrop sits behind the cards and must never compete with them: these
     are all low contrast on purpose. Turn "Darken the backdrop" up if a deck
     still feels busy. Edit the colours below to make your own — it is a text
     file, and SVG stays sharp on any projector. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"
     width="1920" height="1080" preserveAspectRatio="xMidYMid slice">

  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#FAFBF8"/>
      <stop offset="1" stop-color="#DDE6E9"/>
    </linearGradient>
  <filter id="wg" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
  </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#w)"/>
  <rect width="1920" height="1080" filter="url(#wg)" opacity="0.6"/>
</svg>
