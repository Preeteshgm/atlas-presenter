<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:host{
  --film:#E6E9E1; --panel:#F1F3EC; --ink:#14232A; --ink-2:#46565C; --rule:#B3BCB4;
  --blue:#1D5A78; --olive:#4E7A26; --rust:#A93B22; --marker:#EFC318;
  --display:'Archivo Narrow','Arial Narrow',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
.slide{width:100%;min-height:100%;background:var(--film);color:var(--ink);
  font-family:var(--body);font-size:19px;line-height:1.5;padding:50px 58px;
  display:flex;flex-direction:column;position:relative}
.slide::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(to right,rgba(20,35,42,.05) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(20,35,42,.05) 1px,transparent 1px);
  background-size:28px 28px}
.slide>*{position:relative}
h1,h2{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.005em}
h1{font-size:64px;line-height:1;font-weight:700;max-width:19ch}
h2{font-size:42px;line-height:1.04;max-width:22ch}
p{margin:0 0 .7em;max-width:62ch}
.sec-n{font-family:var(--mono);font-size:16px;color:var(--blue);margin-bottom:8px}
.quiet{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums lining-nums}
code{font-family:var(--mono);font-size:.9em}
.foot{font-family:var(--mono);font-size:13px;color:var(--ink-2);
  border-top:1px solid var(--rule);padding-top:12px;margin-top:auto}


.wrap{position:absolute;inset:0;background:#0d1117;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.cap{position:absolute;left:26px;bottom:22px;color:#7f8aa3;
  font-family:'IBM Plex Mono',monospace;font-size:13px}</style>
<div class="wrap">
  <canvas id="c"></canvas>
  <div class="cap">an animated card &mdash; it pauses when the camera leaves</div>
</div>
<script>
(function(){
  var root = document.currentScript.getRootNode();
  var box = root.querySelector('.wrap'), cv = root.querySelector('#c');
  var ctx = cv.getContext('2d'), t = 0, running = false, dpr = 1;
  function size(){ dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = box.clientWidth * dpr; cv.height = box.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function frame(){
    var w = box.clientWidth, h = box.clientHeight;
    ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 5; i++) {
      var p = (t / 3 + i / 5) % 1, x = p * (w + 200) - 100, y = h / 2 + Math.sin(p * 6.28 + i) * h * 0.18;
      ctx.beginPath(); ctx.arc(x, y, 8 + i * 2, 0, 6.283);
      ctx.fillStyle = 'rgba(124,198,255,' + (0.25 + 0.15 * i) + ')'; ctx.fill();
    }
    ctx.strokeStyle = 'rgba(124,198,255,0.25)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (var x2 = 0; x2 <= w; x2 += 8) ctx.lineTo(x2, h / 2 + Math.sin(x2 / 90 + t) * h * 0.16);
    ctx.stroke();
    if (running) { t += 0.02; requestAnimationFrame(frame); }
  }
  new ResizeObserver(function(){ size(); if (!running) frame(); }).observe(box);
  root.host.addEventListener('atlas:enter', function(){ if (!running) { running = true; frame(); } });
  root.host.addEventListener('atlas:leave', function(){ running = false; });
  size(); frame();
})();
</script>
